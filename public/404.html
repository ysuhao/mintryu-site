<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fff8e9">
  <title>404 · 这一页走丢了 · Mint.</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=20260921">
  <link rel="apple-touch-icon" sizes="512x512" href="/favicon.png?v=20260921">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fff8e9;
      --paper-white: #fffdf8;
      --ink: #182449;
      --ink-soft: #4f5a79;
      --blue: #9bd5f3;
      --blue-deep: #4b86bd;
      --yellow: #ffd866;
      --pink: #f6b0bb;
      --pink-deep: #c85f78;
      --mint: #b9e4ce;
      --line: #182449;
      --shadow: 7px 8px 0 var(--ink);
      --font-display: "Nunito", "Noto Sans SC", "PingFang SC", sans-serif;
      --font-body: "Noto Sans SC", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(720px 460px at 96% -8%, rgba(155, 213, 243, .44), transparent 70%),
        radial-gradient(650px 440px at -6% 94%, rgba(246, 176, 187, .32), transparent 70%),
        linear-gradient(135deg, #fffdf7 0%, var(--paper) 48%, #fff4d8 100%);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: radial-gradient(rgba(24, 36, 73, .17) .7px, transparent .8px);
      background-size: 18px 18px;
      mask-image: linear-gradient(to bottom, black, transparent 86%);
    }
    a { color: inherit; }
    img { display: block; max-width: 100%; height: auto; }
    :focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 4px; border-radius: 10px; }

    .shell { width: min(1160px, calc(100% - 36px)); margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 22px;
      min-height: 82px; border-bottom: 2px solid var(--line);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 9px; text-decoration: none;
      font: 900 22px/1 var(--font-display); letter-spacing: -.04em;
    }
    .brand-dot { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--ink); border-radius: 50%; background: var(--pink); }
    .topbar small { color: var(--ink-soft); font: 900 11px/1 var(--font-display); letter-spacing: .17em; }

    main { padding: 64px 0 72px; }
    .lost-card {
      position: relative;
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .8fr); gap: 40px; align-items: center;
      padding: 48px;
      border: 3px solid var(--ink); border-radius: 30px;
      background: var(--paper-white);
      box-shadow: var(--shadow);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 9px; margin: 0;
      color: var(--pink-deep); font: 900 11px/1 var(--font-display); letter-spacing: .17em; text-transform: uppercase;
    }
    .eyebrow::before { content: "✦"; font-size: 16px; }
    h1 {
      margin: 18px 0 16px;
      font: 900 clamp(46px, 7vw, 82px)/.98 var(--font-display);
      letter-spacing: -.07em;
    }
    h1 .blue { color: var(--blue-deep); }
    .lead { max-width: 520px; margin: 0; color: var(--ink-soft); font-size: 17px; line-height: 1.9; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; padding: 0 19px;
      border: 2px solid var(--ink); border-radius: 14px; background: var(--yellow); box-shadow: 4px 5px 0 var(--ink);
      font-size: 14px; font-weight: 900; text-decoration: none; transition: transform .18s ease, box-shadow .18s ease;
    }
    .button:hover { transform: translate(2px, 2px) rotate(-1deg); box-shadow: 2px 3px 0 var(--ink); }
    .button.secondary { background: var(--paper-white); }

    .scene {
      position: relative; min-height: 290px;
      border: 3px solid var(--ink); border-radius: 24px;
      background:
        repeating-linear-gradient(0deg, transparent 0 27px, rgba(75, 134, 189, .16) 27px 28px),
        linear-gradient(160deg, rgba(155, 213, 243, .55), rgba(185, 228, 206, .5));
      transform: rotate(1.5deg);
      overflow: hidden;
    }
    .code {
      position: absolute; top: 18px; left: 20px;
      font: 900 clamp(64px, 9vw, 104px)/1 var(--font-display); letter-spacing: -.06em;
      color: var(--paper-white);
      -webkit-text-stroke: 3px var(--ink);
      paint-order: stroke fill;
      text-shadow: 5px 6px 0 var(--pink);
    }
    .sticker { position: absolute; bottom: -6px; filter: drop-shadow(3px 4px 0 rgba(24, 36, 73, .18)); }
    .sticker.hachiware { right: 34%; width: 38%; transform: rotate(-6deg); }
    .sticker.usagi { right: 2%; width: 36%; transform: rotate(7deg); }
    .bubble {
      position: absolute; right: 16px; top: 22px;
      padding: 8px 12px; border: 2px solid var(--ink); border-radius: 14px 14px 4px 14px;
      background: var(--yellow); font-size: 12px; font-weight: 900;
      transform: rotate(-3deg);
    }

    footer {
      display: flex; justify-content: space-between; gap: 16px; padding: 24px 0 40px;
      border-top: 2px dashed rgba(24, 36, 73, .4);
      color: var(--ink-soft); font: 900 10px var(--font-display); letter-spacing: .12em;
    }

    @media (max-width: 900px) {
      .lost-card { grid-template-columns: 1fr; padding: 36px; }
      .scene { min-height: 250px; }
    }
    @media (max-width: 620px) {
      .shell { width: calc(100% - 28px); }
      .topbar small { display: none; }
      main { padding: 36px 0 52px; }
      .lost-card { padding: 26px 20px; gap: 28px; border-radius: 24px; box-shadow: 5px 6px 0 var(--ink); }
      .lead { font-size: 16px; }
      .actions .button { flex: 1 1 100%; }
      .scene { min-height: 220px; transform: rotate(1deg); }
      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
      .button:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Mint 个人主页">Mint<span class="brand-dot" aria-hidden="true"></span></a>
      <small>PAGE NOT FOUND</small>
    </header>

    <main>
      <section class="lost-card" aria-labelledby="lost-title">
        <div>
          <p class="eyebrow">404 / 这里空空的</p>
          <h1 id="lost-title">这一页<br><span class="blue">走丢了。</span></h1>
          <p class="lead">链接可能写错了，或者这页已经搬家。回主页逛逛，或者去翻翻最近写的文章吧。</p>
          <div class="actions">
            <a class="button" href="/">回到主页 <span aria-hidden="true">↩</span></a>
            <a class="button secondary" href="/blog">看看文章 <span aria-hidden="true">↗</span></a>
          </div>
        </div>
        <div class="scene" role="img" aria-label="蓝色伙伴和黄色兔子伙伴站在写着 404 的纸上，好像在找东西">
          <span class="code" aria-hidden="true">404</span>
          <span class="bubble" aria-hidden="true">咦，路呢？</span>
          <img class="sticker hachiware" src="/mascots/hachiware-sticker.png" alt="" width="598" height="640">
          <img class="sticker usagi" src="/mascots/usagi-sticker.png" alt="" width="616" height="640">
        </div>
      </section>
    </main>

    <footer><span>© 2026 MINT RYU</span><span>made with code, sound &amp; a little light</span></footer>
  </div>
</body>
</html>
